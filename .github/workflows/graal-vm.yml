name: Native Windows Build

on:
  push:
    branches:
      - feature/graal-vm-optimization

  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    name: Build and Test Native Windows Application
    runs-on: windows-latest

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # GraalVM JDK 22
      # ------------------------------------------------------------
      - name: Set up GraalVM JDK 22
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "22"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Verify Java / GraalVM
      # ------------------------------------------------------------
      - name: Verify GraalVM
        shell: pwsh
        run: |
          Write-Host "===== JAVA ====="
          java -version

          Write-Host ""
          Write-Host "===== NATIVE IMAGE ====="
          native-image --version

      # ------------------------------------------------------------
      # Build native executable
      # ------------------------------------------------------------
      - name: Build native executable
        shell: cmd
        run: |
          echo Setting up Visual Studio C++ environment...

          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find VC\Auxiliary\Build\vcvars64.bat`) do call "%%i"

          echo.
          echo ===== MSVC =====
          cl

          echo.
          echo ===== MAVEN NATIVE BUILD =====
          call mvnw.cmd -Pnative clean package -Dmaven.test.skip=true

      # ------------------------------------------------------------
      # Create database directory
      # ------------------------------------------------------------
      - name: Create database directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "target\data"

          Write-Host "Created target\data"

      # ------------------------------------------------------------
      # Run native application and test API
      # ------------------------------------------------------------
      - name: Run native application
        shell: pwsh
        run: |
          $exe = ".\target\job-application-tracker.exe"

          if (-not (Test-Path $exe)) {
              Write-Error "Native executable was not found: $exe"
              exit 1
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "Starting Job Application Tracker Native Application"
          Write-Host "============================================================"
          Write-Host ""

          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList `
              '--spring.datasource.url=jdbc:sqlite:target/data/job_tracker.db' `
            -RedirectStandardOutput "native-output.log" `
            -RedirectStandardError "native-error.log" `
            -PassThru

          $started = $false

          try {

              Write-Host "Process ID: $($process.Id)"
              Write-Host "Waiting for Spring Boot to start..."

              # ----------------------------------------------------
              # Wait for application
              # ----------------------------------------------------
              for ($i = 0; $i -lt 60; $i++) {

                  Start-Sleep -Seconds 1

                  if ($process.HasExited) {
                      Write-Host ""
                      Write-Host "Application exited unexpectedly."
                      Write-Host "Exit code: $($process.ExitCode)"
                      break
                  }

                  try {

                      $response = Invoke-WebRequest `
                        -Uri "http://localhost:8080/api/applications" `
                        -UseBasicParsing `
                        -TimeoutSec 2

                      if ($response.StatusCode -lt 500) {
                          $started = $true
                          break
                      }

                  }
                  catch {
                      # Application is still starting.
                  }
              }

              # ----------------------------------------------------
              # Print Spring Boot logs
              # ----------------------------------------------------
              Write-Host ""
              Write-Host "============================================================"
              Write-Host "SPRING BOOT STARTUP OUTPUT"
              Write-Host "============================================================"
              Write-Host ""

              if (Test-Path "native-output.log") {
                  Get-Content "native-output.log"
              }

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "APPLICATION STDERR"
              Write-Host "============================================================"
              Write-Host ""

              if (Test-Path "native-error.log") {
                  Get-Content "native-error.log"
              }

              Write-Host ""
              Write-Host "============================================================"

              # ----------------------------------------------------
              # Check startup result
              # ----------------------------------------------------
              if (-not $started) {

                  Write-Host ""
                  Write-Error "Native application failed to start or API did not respond."

                  if ($process.HasExited) {
                      Write-Host "Process exit code: $($process.ExitCode)"
                  }

                  exit 1
              }

              Write-Host ""
              Write-Host "Native application started successfully."
              Write-Host "API responded successfully."
              Write-Host ""

              # ----------------------------------------------------
              # Verify database was created
              # ----------------------------------------------------
              $database = "target\data\job_tracker.db"

              if (Test-Path $database) {

                  $size = (Get-Item $database).Length

                  Write-Host "SQLite database created successfully."
                  Write-Host "Database: $database"
                  Write-Host "Size: $size bytes"

              }
              else {

                  Write-Error "SQLite database was not created."
                  exit 1
              }

              Write-Host ""
              Write-Host "Native application test PASSED."

          }
          finally {

              # ----------------------------------------------------
              # Stop application
              # ----------------------------------------------------
              if (-not $process.HasExited) {

                  Write-Host ""
                  Write-Host "Stopping native application..."

                  Stop-Process `
                    -Id $process.Id `
                    -Force `
                    -ErrorAction SilentlyContinue

                  Write-Host "Native application stopped."
              }
          }

      # ------------------------------------------------------------
      # Install UPX
      # ------------------------------------------------------------
      - name: Install UPX
        shell: pwsh
        run: |
          Write-Host "Installing UPX..."

          choco install upx -y --no-progress

          Write-Host ""
          Write-Host "===== UPX VERSION ====="
          upx --version

      # ------------------------------------------------------------
      # Create distribution directory
      # ------------------------------------------------------------
      - name: Prepare distribution
        shell: pwsh
        run: |
          $distribution = "target\distribution"
          $appDirectory = "$distribution\job-application-tracker"

          # Remove previous distribution if present
          if (Test-Path $distribution) {
              Remove-Item `
                -Path $distribution `
                -Recurse `
                -Force
          }

          # Create directories
          New-Item `
            -ItemType Directory `
            -Force `
            -Path $appDirectory | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$appDirectory\data" | Out-Null

          Write-Host "Created:"
          Write-Host "  $appDirectory"
          Write-Host "  $appDirectory\data"

      # ------------------------------------------------------------
      # Copy native executable
      # ------------------------------------------------------------
      - name: Copy native executable
        shell: pwsh
        run: |
          $source = "target\job-application-tracker.exe"
          $destination = "target\distribution\job-application-tracker\job-application-tracker.exe"

          if (-not (Test-Path $source)) {
              Write-Error "Native executable not found: $source"
              exit 1
          }

          Copy-Item `
            -Path $source `
            -Destination $destination `
            -Force

          Write-Host "Copied native executable."

      # ------------------------------------------------------------
      # Copy required native DLLs
      # ------------------------------------------------------------
      - name: Copy native DLLs
        shell: pwsh
        run: |
          $source = "target"
          $destination = "target\distribution\job-application-tracker"

          $dlls = @(
              "awt.dll",
              "fontmanager.dll",
              "freetype.dll",
              "java.dll",
              "javaaccessbridge.dll",
              "javajpeg.dll",
              "jawt.dll",
              "jvm.dll",
              "lcms.dll"
          )

          foreach ($dll in $dlls) {

              $sourceFile = Join-Path $source $dll

              if (Test-Path $sourceFile) {

                  Copy-Item `
                    -Path $sourceFile `
                    -Destination $destination `
                    -Force

                  Write-Host "Copied $dll"

              }
              else {

                  Write-Host "WARNING: $dll was not generated."

              }
          }

      # ------------------------------------------------------------
      # Compress native executable with UPX
      # ------------------------------------------------------------
      - name: Compress native executable
        shell: pwsh
        run: |
          $exe = "target\distribution\job-application-tracker\job-application-tracker.exe"

          if (-not (Test-Path $exe)) {
              Write-Error "Distribution executable not found: $exe"
              exit 1
          }

          $before = (Get-Item $exe).Length

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "UPX COMPRESSION"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Before compression:"
          Write-Host "$before bytes"
          Write-Host "$([math]::Round($before / 1MB, 2)) MB"

          upx `
            --best `
            --lzma `
            $exe

          if ($LASTEXITCODE -ne 0) {
              Write-Error "UPX compression failed."
              exit 1
          }

          $after = (Get-Item $exe).Length

          $beforeMB = [math]::Round($before / 1MB, 2)
          $afterMB = [math]::Round($after / 1MB, 2)
          $savedMB = [math]::Round(($before - $after) / 1MB, 2)
          $savedPercent = [math]::Round((1 - ($after / $before)) * 100, 2)

          Write-Host ""
          Write-Host "After compression:"
          Write-Host "$after bytes"
          Write-Host "$afterMB MB"

          Write-Host ""
          Write-Host "Space saved:"
          Write-Host "$savedMB MB"
          Write-Host "Reduction: $savedPercent%"

          Write-Host ""
          Write-Host "===== VERIFY UPX ====="

          upx -t $exe

          if ($LASTEXITCODE -ne 0) {
              Write-Error "UPX verification failed."
              exit 1
          }

          Write-Host ""
          Write-Host "UPX verification PASSED."

      # ------------------------------------------------------------
      # Display final distribution
      # ------------------------------------------------------------
      - name: Show distribution contents
        shell: pwsh
        run: |
          $distribution = "target\distribution\job-application-tracker"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "FINAL DISTRIBUTION"
          Write-Host "============================================================"
          Write-Host ""

          Get-ChildItem `
            -Path $distribution `
            -Recurse `
            -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          $totalSize = (
              Get-ChildItem `
                -Path $distribution `
                -Recurse `
                -File |
                Measure-Object -Property Length -Sum
          ).Sum

          Write-Host ""
          Write-Host "Total distribution size:"
          Write-Host "$([math]::Round($totalSize / 1MB, 2)) MB"

      # ------------------------------------------------------------
      # Create ZIP package
      # ------------------------------------------------------------
      - name: Create distribution ZIP
        shell: pwsh
        run: |
          $source = "target\distribution\job-application-tracker"
          $zip = "target\job-application-tracker-windows-native.zip"

          if (Test-Path $zip) {
              Remove-Item `
                -Path $zip `
                -Force
          }

          Compress-Archive `
            -Path $source `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              Write-Error "ZIP package was not created."
              exit 1
          }

          $zipSize = (Get-Item $zip).Length

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "PACKAGE CREATED"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Package:"
          Write-Host $zip
          Write-Host ""
          Write-Host "Size:"
          Write-Host "$([math]::Round($zipSize / 1MB, 2)) MB"

      # ------------------------------------------------------------
      # Upload ZIP artifact
      # ------------------------------------------------------------
      - name: Upload native Windows package
        uses: actions/upload-artifact@v4
        with:
          name: job-application-tracker-windows-native
          path: target/job-application-tracker-windows-native.zip
          if-no-files-found: error
          retention-days: 3