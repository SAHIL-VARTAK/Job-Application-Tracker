name: Native Windows Build

on:
  push:
    branches:
      - feature/graal-vm-optimization

  workflow_dispatch:

permissions:
  contents: read

env:
  NATIVE_JDK_VERSION: "21"

jobs:
  native-build:
    name: Build and Test Native Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GraalVM
        shell: pwsh
        run: |
          Write-Host "===== JAVA ====="
          java -version

          Write-Host ""
          Write-Host "===== JAVA HOME ====="
          Write-Host $env:JAVA_HOME

          Write-Host ""
          Write-Host "===== NATIVE IMAGE ====="
          native-image --version

      - name: Build native executable
        shell: cmd
        run: |
          echo Setting up Visual Studio C++ environment...

          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%Microsoft Visual StudioInstaller\u000Bswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find VCAuxiliaryBuild\u000Bcvars64.bat`) do call "%%i"

          echo.
          echo ===== MSVC =====
          cl

          echo.
          echo ===== MAVEN JAVA VERSION =====
          call mvnw.cmd help:evaluate -Dexpression=java.version -q -DforceStdout -Djava.version=%NATIVE_JDK_VERSION%

          echo.
          echo ===== MAVEN NATIVE BUILD =====
          call mvnw.cmd -Pnative clean package -Dmaven.test.skip=true -Djava.version=%NATIVE_JDK_VERSION%

          if errorlevel 1 exit /b %errorlevel%

      - name: Create database directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "targetdata" | Out-Null

          Write-Host "Created targetdata"

      - name: Install UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          install-only: true

      - name: Verify UPX
        shell: pwsh
        run: |
          upx --version

      - name: Compress native executable
        shell: pwsh
        run: |
          $exe = ".\targetjob-application-tracker.exe"

          if (-not (Test-Path $exe)) {
              Write-Error "Native executable was not found: $exe"
              exit 1
          }

          $originalSize = (Get-Item $exe).Length

          Write-Host "Original executable size:"
          Write-Host "$([math]::Round($originalSize / 1MB, 2)) MB"

          upx --best --lzma $exe

          if ($LASTEXITCODE -ne 0) {
              Write-Error "UPX compression failed."
              exit 1
          }

          upx -t $exe

          if ($LASTEXITCODE -ne 0) {
              Write-Error "UPX validation failed."
              exit 1
          }

          $compressedSize = (Get-Item $exe).Length

          Write-Host "Compressed executable size:"
          Write-Host "$([math]::Round($compressedSize / 1MB, 2)) MB"

      - name: Run compressed native application
        shell: pwsh
        run: |
          $exe = ".\targetjob-application-tracker.exe"

          if (-not (Test-Path $exe)) {
              Write-Error "Native executable was not found: $exe"
              exit 1
          }

          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList `
              '--spring.datasource.url=jdbc:sqlite:target/data/job_tracker.db' `
            -RedirectStandardOutput "native-output.log" `
            -RedirectStandardError "native-error.log" `
            -PassThru

          $started = $false

          try {
              Write-Host "Process ID: $($process.Id)"
              Write-Host "Waiting for Spring Boot to start..."

              for ($i = 0; $i -lt 60; $i++) {
                  Start-Sleep -Seconds 1

                  if ($process.HasExited) {
                      Write-Host ""
                      Write-Host "Application exited unexpectedly."
                      Write-Host "Exit code: $($process.ExitCode)"
                      break
                  }

                  try {
                      $response = Invoke-WebRequest `
                        -Uri "http://localhost:8080/api/applications" `
                        -UseBasicParsing `
                        -TimeoutSec 2

                      if ($response.StatusCode -lt 500) {
                          $started = $true
                          break
                      }
                  }
                  catch {
                  }
              }

              Write-Host ""
              Write-Host "===== SPRING BOOT STARTUP OUTPUT ====="

              if (Test-Path "native-output.log") {
                  Get-Content "native-output.log"
              }

              Write-Host ""
              Write-Host "===== APPLICATION STDERR ====="

              if (Test-Path "native-error.log") {
                  Get-Content "native-error.log"
              }

              if (-not $started) {
                  Write-Error "Compressed native application failed to start or API did not respond."

                  if ($process.HasExited) {
                      Write-Host "Process exit code: $($process.ExitCode)"
                  }

                  exit 1
              }

              Write-Host ""
              Write-Host "Compressed native application started successfully."
              Write-Host "API responded successfully."

              $database = "targetdatajob_tracker.db"

              if (Test-Path $database) {
                  $size = (Get-Item $database).Length

                  Write-Host ""
                  Write-Host "SQLite database created successfully."
                  Write-Host "Database: $database"
                  Write-Host "Size: $size bytes"
              }
              else {
                  Write-Error "SQLite database was not created."
                  exit 1
              }

              Write-Host ""
              Write-Host "Compressed native application test PASSED."
          }
          finally {
              if (-not $process.HasExited) {
                  Write-Host ""
                  Write-Host "Stopping native application..."

                  Stop-Process `
                    -Id $process.Id `
                    -Force `
                    -ErrorAction SilentlyContinue

                  Write-Host "Native application stopped."
              }
          }

      - name: Prepare distribution
        shell: pwsh
        run: |
          $distribution = "targetdistribution"
          $appDirectory = "$distributionjob-application-tracker"

          if (Test-Path $distribution) {
              Remove-Item `
                -Path $distribution `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $appDirectory | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$appDirectorydata" | Out-Null

          Write-Host "Distribution directory prepared."

      - name: Copy compressed native executable
        shell: pwsh
        run: |
          $source = "targetjob-application-tracker.exe"
          $destination = "targetdistributionjob-application-trackerjob-application-tracker.exe"

          if (-not (Test-Path $source)) {
              Write-Error "Native executable not found: $source"
              exit 1
          }

          Copy-Item `
            -Path $source `
            -Destination $destination `
            -Force

          Write-Host "Copied compressed native executable."

      - name: Copy native DLLs
        shell: pwsh
        run: |
          $source = "target"
          $destination = "targetdistributionjob-application-tracker"

          $dlls = @(
              "awt.dll",
              "fontmanager.dll",
              "freetype.dll",
              "java.dll",
              "javaaccessbridge.dll",
              "javajpeg.dll",
              "jawt.dll",
              "jvm.dll",
              "lcms.dll"
          )

          foreach ($dll in $dlls) {
              $sourceFile = Join-Path $source $dll

              if (Test-Path $sourceFile) {
                  Copy-Item `
                    -Path $sourceFile `
                    -Destination $destination `
                    -Force

                  Write-Host "Copied $dll"
              }
              else {
                  Write-Host "WARNING: $dll was not generated."
              }
          }

      - name: Show distribution contents
        shell: pwsh
        run: |
          $distribution = "targetdistributionjob-application-tracker"

          Write-Host ""
          Write-Host "===== FINAL DISTRIBUTION ====="

          Get-ChildItem `
            -Path $distribution `
            -Recurse `
            -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          $totalSize = (
              Get-ChildItem `
                -Path $distribution `
                -Recurse `
                -File |
                Measure-Object -Property Length -Sum
          ).Sum

          Write-Host ""
          Write-Host "Total distribution size:"
          Write-Host "$([math]::Round($totalSize / 1MB, 2)) MB"

      - name: Create distribution ZIP
        shell: pwsh
        run: |
          $source = "targetdistributionjob-application-tracker"
          $zip = "targetjob-application-tracker-windows-native.zip"

          if (Test-Path $zip) {
              Remove-Item `
                -Path $zip `
                -Force
          }

          Compress-Archive `
            -Path $source `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              Write-Error "ZIP package was not created."
              exit 1
          }

          $zipSize = (Get-Item $zip).Length

          Write-Host ""
          Write-Host "===== PACKAGE CREATED ====="
          Write-Host "Package: $zip"
          Write-Host "Size: $([math]::Round($zipSize / 1MB, 2)) MB"

      - name: Upload native Windows package
        uses: actions/upload-artifact@v4
        with:
          name: job-application-tracker-windows-native-graalvm-21-upx
          path: target/job-application-tracker-windows-native.zip
          if-no-files-found: error
          retention-days: 3